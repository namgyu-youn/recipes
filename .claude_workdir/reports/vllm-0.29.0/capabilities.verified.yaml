      Remote media responses and compressed media files can expand into gigabytes of

      memory. vLLM enforces download and decode-size limits to prevent out-of-memory

      denial of service:

      | `VLLM_MAX_MEDIA_DOWNLOAD_SIZE_MB` | `256` | Maximum size in MB for a single remote media response.
      Oversized responses are rejected while streaming before the full body is materialized in memory.
