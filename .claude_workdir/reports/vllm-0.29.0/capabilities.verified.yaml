  evidence:
    source: docs-diff
    section: docs/training/weight_transfer/sharded_rdt.md
    prs: []
    text: '# Sharded RDT Engine


      The sharded RDT weight transfer engine moves weights point-to-point over [NIXL](https://github.com/ai-dynamo/nixl)
      using Ray Direct Transport (RDT), Ray''s zero-copy tensor transport between actors. It is **pull-based**:
      the inference workers initiate every transfer and each one asks only for the *slice* it consumes
      under tensor and expert parallelism. A large MoE model therefore moves roughly `total_bytes / num_workers`
      per worker instead of the `total_bytes` a broadcast costs.


      ## When to Use Sharded RDT


      - Very large models where broadcasting whole parameters is the bot'
  verified:
  - --distributed-executor-backend exists at v0.29.0
  - --weight-transfer-config exists at v0.29.0
  confidence: high
