    section: docs/features/quantization/b12x.md
    prs: []
    text: b12x provides optional CUDA kernels for NVIDIA SM120 and SM121 GPUs (RTX Pro 6000/5000, RTX
      5090, DGX Spark GB10), installed with pip install vllm[b12x]. b12x linear kernels participate in
      automatic selection after established optimized backends and before emulation; select them explicitly
      with --linear-backend b12x and --moe-backend b12x. Only pass --moe-backend b12x for a compatible
      NVFP4 or MXFP4 MoE model. b12x uses MXFP8 activations by default for MXFP4 MoE and the checkpoint's
      activation format for NVFP4 MoE; set VLLM_B12X_MOE_FP4_FORCE_A16=1 to force BF16 activations for
      either FP4 weight format. Linear supports per-tensor FP8, 128x128 block FP8, MXFP8, NVFP4 and MXFP4.
      The b12x MoE backend does not support expert parallelism, expert maps, EXL3, or NF3.
    also: []
  install:
    command: uv pip install "vllm[b12x]"
    note: b12x kernels ship as an extra, not in the base wheel
