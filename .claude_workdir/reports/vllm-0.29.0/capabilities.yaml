- id: b12x-linear-and-moe-backends
  kind: capability
  concept: moe_backend
  title: b12x linear and MoE backends for SM120/SM121
  since: v0.29.0
  how_enabled:
    mode: explicit
    flags:
    - --linear-backend
    - --moe-backend
    envs:
    - VLLM_B12X_MOE_FP4_FORCE_A16
    enum_values:
    - flag: --linear-backend
      value: b12x
    - flag: --moe-backend
      value: b12x
  default_on: false
  reverse_markers:
    now_default: []
    obsolete: []
  applies_to:
    hardware:
    - rtx_pro_6000
    - rtx_pro_6000_2x
    - rtx_pro_6000_4x
    - rtx_pro_6000_8x
    - rtx_pro_5000
    - rtx_pro_5000_4x
    - rtx_5090
    - rtx_5090_2x
    - dgx_spark_gb10
    model_traits: {}
    quant:
    - nvfp4
    - mxfp4
    - mxfp8
  effect: perf
  evidence:
    source: docs-diff
    section: docs/features/quantization/b12x.md
    prs: []
    text: b12x provides optional CUDA kernels for NVIDIA SM120 and SM121 GPUs (RTX Pro 6000/5000, RTX
      5090, DGX Spark GB10), installed with `pip install vllm[b12x]`. Select them with --linear-backend
      b12x and --moe-backend b12x. Only pass --moe-backend b12x for a compatible NVFP4 or MXFP4 MoE model.
      b12x uses MXFP8 activations by default for MXFP4 MoE and the checkpoint's activation format for
      NVFP4 MoE; set VLLM_B12X_MOE_FP4_FORCE_A16=1 to force BF16 activations. The b12x MoE backend does
      not support expert parallelism, expert maps, EXL3, or NF3.
    also: []
  curated: true
- id: trace-replay-enable-trace-replay
  kind: capability
  concept: scheduling
  title: 'Trace Replay: --enable-trace-replay'
  since: v0.29.0
  how_enabled:
