capabilities:
- id: model-runner-v2-is-now-the-default-for-all-model
  kind: capability
  concept: default_change
  title: 'Model Runner V2 is now the default for all models: completing the rollout that began with pooling
    models'
  since: v0.29.0
  how_enabled:
    mode: auto
    flags: []
    envs: []
    enum_values: []
  default_on: true
  reverse_markers:
    now_default:
    - VLLM_USE_V2_MODEL_RUNNER
    obsolete:
    - VLLM_USE_V1
  applies_to:
    hardware:
    - amd
    - nvidia
    model_traits:
      features:
      - spec_decoding
    quant: []
  effect: memory
  evidence:
    source: release-notes
    section: Highlights
    prs:
    - '42963'
    - '48290'
    - '49811'
    - '50465'
    - '53183'
    - '53306'
    text: '**Model Runner V2 is now the default for all models** (#53183), completing the rollout that
      began with pooling models (#48290). MRV2 also gained CUDA graph memory profiling for KV cache auto-sizing
      (#53306), batch-sharded sampling that cuts per-step logits memory by 1/TP (#50465), prompt embeds
      (#42963), `extract_hidden_states` speculation (#49811), padded FULL cudagraph dispatch for uniform
      decode under spec decode (#53407), and DP-sync skipping before EAGLE/MTP draft prefill (#53694).
      MRV1 remains in use for a few ROCm models and features MRV2 does not yet support.'
    also:
    - section: Breaking Changes & Deprecations
      source: release-notes
  curated: true
- id: kimi-k3-and-deepseek-v4-performance-fused-mxfp4-
