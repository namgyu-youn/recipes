    obsolete: []
  applies_to:
    hardware: []
    model_traits: {}
    quant: []
  effect: correctness
  evidence:
    source: docs-diff
    section: docs/serving/online_serving/trace_replay.md
    prs: []
    text: '# Trace Replay


      Trace replay forces the engine to emit a predetermined token sequence during decoding while computing
      real logprobs from the model''s unmodified logit distribution. The primary use case is comparing
      logprob distributions across different configurations:


      - **Inference config diff**: compare logprobs between different quantization schemes, tensor parallelism
      layouts, or attention backends for the same model.

      - **Train vs inference diff**: replay a training-time token sequence through the inference engine
      to detect logprob divergence caused by numerical differences between trainin'
    also: []
  curated: true
- id: security-vllm-max-media-download-size-mb
  kind: capability
  concept: frontend
  title: Media download size limits for multimodal serving
  since: v0.29.0
  how_enabled:
    mode: explicit
    flags: []
    envs:
    - VLLM_MAX_MEDIA_DOWNLOAD_SIZE_MB
    enum_values: []
  default_on: false
  reverse_markers:
    now_default: []
    obsolete: []
  applies_to:
    hardware: []
    model_traits:
      tasks:
      - multimodal
    quant: []
  effect: memory
  evidence:
    source: docs-diff
    section: docs/usage/security.md
    prs: []
    text: '### 5. **Restrict Media Download and Decode Sizes:**

      Remote media responses and compressed media files can expand into gigabytes of

      memory. vLLM enforces download and decode-size limits to prevent out-of-memory

      denial of service:

      | `VLLM_MAX_MEDIA_DOWNLOAD_SIZE_MB` | `256` | Maximum size in MB for a single remote media response.
      Oversized responses are rejected while streaming before the full body is materialized in memory.
      |

      | `VLLM_MAX_AUDIO_CLIP_FILESIZE_MB` | `25` | Maximum compressed filesize in MB for a single audio
      file. Enforced on all audio inputs (multimodal chat URLs, speech-to-text'
    also: []
  curated: true
