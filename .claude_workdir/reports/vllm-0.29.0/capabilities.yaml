    text: '**Kimi-K3 and DeepSeek V4 performance**: fused MXFP4 top-k finalization in the K3 latent tail
      (about 5% E2E latency, #53152), K3 Mamba metadata preparation in one Triton launch (6.6-7.6x kernel
      speedup, #52388), tuned Hopper low-latency GEMM (#54088) now also dispatched on SM100 (#53534) and
      used for `eh_proj` (12.9-25.2% kernel speedup, #53942), GEMM-RS extended to GEMM-AR (#53053), MLA
      gate merged into the QKV-A projection (#54015), K3 DCP with DSpark (#52188) and DCP partial prefix
      cache hits (#50493); DeepSeek V4 shared experts fused into MegaMoE (#53040), adaptive top-k width
      re-landed (#'
    also: []
  curated: true
